name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, to catch harness CLI releases that change plugin loading
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate Agent Plugins Specification
        run: npm run validate:spec

      - name: Run Unit Tests
        run: npm test

  install:
    name: install (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            package: '@anthropic-ai/claude-code'
          - harness: codex
            package: '@openai/codex'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install ${{ matrix.harness }} CLI
        run: |
          npm install --global ${{ matrix.package }}
          ${{ matrix.harness }} --version

      - name: Validate and install plugin
        run: scripts/verify-install.sh ${{ matrix.harness }}
